<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Cari Pahala Terkumpul</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>✨ Kutip Pahala ✨</h1>
            <div class="score-board">Total Pahala: <span id="score">0</span></div>
        </div>

        <div id="game-area">
            </div>
        
        <div class="legend">
            <span class="tag zikir">📿 Zikir (+10)</span>
            <span class="tag solat">🕋 Solat (+100)</span>
            <span class="tag rare">📖 Ibadah Besar (+200-400)</span>
        </div>
        <button id="reset-btn">Reset Pahala</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
